<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search for movies</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lib/fontawesome.css">
  <link rel="stylesheet" href="lib/loader.css">
  <script src="main.js" defer></script>
</head>

<body>
  <main>
    <header>
      <h2 id="logo">MOVIES</h2>
      <nav>
        <ul>
          <li><a href="/index.html">Movies</a></li>
          <li><a href="/shows.html">TV Shows</a></li>
        </ul>
      </nav>
    </header>
    
    <div id="msgBox">
      
    </div>
    
    <section id="search">
      <form action="/search.html" method="get" accept-charset="utf-8">
  
        <div>
          <input type="radio" name="type" value="movie" id="movies" checked />
          <label for="movies">Movies</label>
          
          <input type="radio" name="type" value="tv" id="tvShows" />
          <label for="tvShows">TV Shows</label>
        </div>
        
        <div>
          <input type="search" name="search" id="search-bar" placeholder="Enter search item">
          <button type="submit"><i class="fa fa-search"></i></button>
        </div>
        
      </form>
    </section>
    
    <section id="search-movies" class="parentCard">
      <h2>Search results</h2>
      <header id="search-heading">
        
      </header>
      <section id="searchResults" class="subparent-card">
        
      </section>
      
      <section id="pagination">
       
      </section>
    </section>
  </main>
  
  <div id="loading" class="hide">
    <div class="lds-ellipsis"><div></div><div></div><div></div><div></div></div>
  </div>
</body>

</html>
