<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Movies</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lib/fontawesome.css">
  <link rel="stylesheet" href="lib/loader.css">
  
  <script src="main.js" defer></script>
</head>

<body>
  <main>
    <header>
      <h2 id="logo">MOVIES</h2>
      <nav>
        <ul>
          <li><a href="/index.html" class="navLink">Movies</a></li>
          <li><a href="/shows.html" class="navLink">TV Shows</a></li>
        </ul>
      </nav>
    </header>
    
    <section id="banner">
      <h3>NOW PLAYING</h3>
    </section>
    
    <section id="now-playing">
      
    </section>
    
    <section id="search">
      <form method="get" accept-charset="utf-8">
        
       <div>
         <input type="radio" name="movies" id="movies" />
         <label for="movies">Movies</label>
         
          <input type="radio" name="movies" id="tvShows" />
          <label for="tvShows">TV Shows</label>
        </div>
        
        <div>
          <input type="search" name="search" id="search-bar" placeholder="Enter search item">
          <button type="submit"><i class="fas fa-user"></i></button>
        </div>
        
      </form>
    </section>
    
    <section id="popular-movies" class="parentCard">
      <h2>POPULAR MOVIES</h2>
      <section id="movies" class="subparent-card">
        
      </section>
    </section>
  </main>
  
  <div id="loading" class="hide">
    <div class="lds-ellipsis"><div></div><div></div><div></div><div></div></div>
  </div>
  
</body>

</html>
